<!doctype html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AireMañana — poster</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* A4 poster for a school noticeboard. Always light, prints edge to edge. */
  :root { --bg: #F5F4EF; --ink: #101317; --ink-2: #3E444C; --muted: #7C828B; --line: #E4E1D9; --good: #14A06B; --mod: #D99E12; --bad: #DE3D33;
    --serif: "Instrument Serif", Georgia, serif; --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; color-scheme: light; }
  * { box-sizing: border-box; }
  @page { size: A4; margin: 0; }
  html, body { margin: 0; background: #D9D6CE; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; gap: 10px; padding: 12px; background: rgba(245,244,239,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar button, .bar a { font: 500 14px var(--sans); color: var(--ink); background: #fff; border: 1px solid #D5D1C7; border-radius: 999px; padding: 9px 16px; cursor: pointer; text-decoration: none; }
  .bar button.main { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .stage { padding: 28px 12px 60px; display: flex; justify-content: center; }
  .sheet { width: 210mm; height: 297mm; flex: none; background: var(--bg); padding: 16mm 16mm 13mm; display: flex; flex-direction: column; box-shadow: 0 30px 70px -30px rgba(0,0,0,.45); position: relative; overflow: hidden; transform-origin: top center; }
  .sheet::before { content: ""; position: absolute; left: -30mm; top: -40mm; width: 150mm; height: 150mm; border-radius: 50%; background: radial-gradient(closest-side, rgba(20,160,107,.16), transparent); }
  .top { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 19px; }
  .brand em { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 24px; }
  .brand svg { width: 34px; height: 34px; }
  .tag { font: 500 10.5px var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .for { margin-top: 14mm; font: 500 11px/1.5 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); position: relative; }
  .for span { color: var(--muted); }
  h1 { font: 400 50pt/0.98 var(--serif); letter-spacing: -0.01em; margin: 4mm 0 0; text-wrap: balance; position: relative; }
  .lead { font-size: 13pt; line-height: 1.45; color: var(--ink-2); margin: 6mm 0 0; max-width: 155mm; text-wrap: pretty; }
  .mid { display: grid; grid-template-columns: 78mm 1fr; gap: 10mm; margin-top: 10mm; align-items: start; }
  .qr { background: #fff; border-radius: 6mm; padding: 6mm; border: 1px solid var(--line); }
  .qr svg { display: block; width: 100%; height: auto; }
  .qr-url { margin-top: 3mm; font: 500 8.5pt var(--mono); color: var(--ink-2); text-align: center; word-break: break-all; }
  .scan { font: 600 12pt var(--sans); margin-bottom: 4mm; }
  .rows { display: grid; gap: 3.5mm; }
  .row { display: grid; grid-template-columns: 7mm 1fr; gap: 3mm; align-items: start; padding: 4mm 4.5mm; border-radius: 4.5mm; background: #fff; border: 1px solid var(--line); }
  .row i { width: 5mm; height: 5mm; border-radius: 50%; margin-top: 1.2mm; }
  .row b { display: block; font-size: 12.5pt; font-weight: 600; }
  .row span { display: block; font: 500 9.5pt var(--mono); color: var(--muted); margin-top: 1mm; }
  .best { margin-top: 5mm; padding: 4mm 4.5mm; border-radius: 4.5mm; background: rgba(20,160,107,.1); font-size: 11.5pt; line-height: 1.4; }
  .best b { font-family: var(--mono); font-weight: 500; }
  .facts { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; padding-top: 7mm; border-top: 1px solid var(--line); }
  .facts div b { display: block; font: 400 26pt/1 var(--serif); }
  .facts div span { display: block; font-size: 9pt; color: var(--ink-2); margin-top: 1.5mm; line-height: 1.35; }
  .foot { margin-top: 6mm; font-size: 8.5pt; color: var(--muted); line-height: 1.45; display: flex; justify-content: space-between; gap: 8mm; }
  @media print { html, body { background: var(--bg); } .bar { display: none; } .stage { padding: 0; height: auto !important; } .sheet { box-shadow: none; transform: none !important; } }
</style>
</head>
<body>
<div class="bar"><button type="button" class="main" id="print"></button><a id="back" href="./"></a></div>
<div class="stage"><article class="sheet" id="sheet">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#101317"/><path d="M6 19.5c3.2-3.6 6.6-3.6 10 0s6.8 3.6 10 0" fill="none" stroke="#F5F4EF" stroke-width="2.4" stroke-linecap="round"/><path d="M8.5 13.5c2.5-2.6 5-2.6 7.5 0s5 2.6 7.5 0" fill="none" stroke="#F5F4EF" stroke-width="2.4" stroke-linecap="round" opacity=".55"/></svg><span>Aire<em>Mañana</em></span></div>
    <div class="tag" id="tag"></div>
  </div>
  <div class="for" id="for"></div>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>
  <div class="mid">
    <div><div class="qr" id="qr"></div><div class="qr-url" id="url"></div></div>
    <div>
      <div class="scan" id="scan"></div>
      <div class="rows" id="rows"></div>
      <div class="best" id="best"></div>
    </div>
  </div>
  <div class="facts" id="facts"></div>
  <div class="foot"><span id="foot1"></span><span id="foot2"></span></div>
</article></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
(() => {
  "use strict";
  const SITE = "https://julianjms-beep.github.io/aire-manana/";
  const T = {
    en: { print: "Print / save as PDF", back: "← Back to the forecast", tag: "Air quality · Madrid", for: "For {p}",
      h1: "Outdoor PE tomorrow?", lead: "Every evening after 18:30, scan the code to see tomorrow's nitrogen dioxide (NO₂) — the traffic pollutant that children with asthma feel first — and whether PE and recess can be outdoors.",
      scan: "What the colours mean", ok: "PE and recess outdoors", watch: "Outdoors is fine — keep an eye on it", alert: "Move PE and recess indoors",
      okv: "below 35 µg/m³", watchv: "35 – {a} µg/m³", alertv: "{a} µg/m³ or more", best: "The cleanest school hours here are usually <b>{w}</b> — a good slot for outdoor PE.",
      f1: "less error than “tomorrow = today”, tested on 932 days", f2: "official stations, forecast every evening", f3: "schools and nurseries in Madrid",
      station: "Nearest station: {s} ({d} km)", stationOnly: "Station: {s}",
      foot1: "Data: Ayuntamiento de Madrid, EEA, Open-Meteo (ECMWF). Student prototype — not medical advice.", foot2: "Veritas AI Hackathon 2026" },
    es: { print: "Imprimir / guardar PDF", back: "← Volver a la previsión", tag: "Calidad del aire · Madrid", for: "Para {p}",
      h1: "¿Educación Física fuera mañana?", lead: "Cada tarde, después de las 18:30, escanea el código y mira el dióxido de nitrógeno (NO₂) previsto para mañana — la contaminación del tráfico que antes notan los niños con asma — y si la clase y el recreo pueden ser al aire libre.",
      scan: "Qué significa cada color", ok: "EF y recreo, al aire libre", watch: "Se puede salir — pero conviene vigilarlo", alert: "EF y recreo, mejor dentro",
      okv: "menos de 35 µg/m³", watchv: "35 – {a} µg/m³", alertv: "{a} µg/m³ o más", best: "Aquí, las horas más limpias del horario escolar suelen ser <b>{w}</b>: buena franja para EF fuera.",
      f1: "menos error que «mañana = hoy», probado en 932 días", f2: "estaciones oficiales, previsión cada tarde", f3: "colegios y escuelas infantiles en Madrid",
      station: "Estación más cercana: {s} ({d} km)", stationOnly: "Estación: {s}",
      foot1: "Datos: Ayuntamiento de Madrid, EEA, Open-Meteo (ECMWF). Prototipo de estudiante — no es consejo médico.", foot2: "Veritas AI Hackathon 2026" },
  };
  const q = new URLSearchParams(location.search);
  const lang = q.get("lang") === "en" ? "en" : "es", L = T[lang];
  const t = (k, v = {}) => L[k].replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (v, d = 0) => Number(v).toLocaleString(lang === "es" ? "es-ES" : "en-GB", { maximumFractionDigits: d, minimumFractionDigits: d });
  document.documentElement.lang = lang;
  const st = Number(q.get("st")) || 8, sc = Number(q.get("sc")) || 0;
  const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const target = new URL(local ? SITE : new URL("./", location.href).toString());
  if (sc) target.searchParams.set("sc", sc); else target.searchParams.set("st", st);
  target.searchParams.set("lang", lang);
  const url = target.toString();

  // QR code drawn as a crisp SVG path
  const qr = qrcode(0, "M"); qr.addData(url); qr.make();
  const n = qr.getModuleCount(); let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  document.getElementById("qr").innerHTML = `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges" role="img" aria-label="${esc(url)}"><path d="${d}" fill="#101317"/></svg>`;
  document.getElementById("url").textContent = url.replace(/^https:\/\//, "").replace(/\/?\?.*$/, "");

  const set = (id, html) => { document.getElementById(id).innerHTML = html; };
  set("print", esc(L.print)); set("back", esc(L.back)); set("tag", esc(L.tag)); set("h1", esc(L.h1)); set("lead", esc(L.lead)); set("scan", esc(L.scan));
  set("foot1", esc(L.foot1)); set("foot2", esc(L.foot2));
  document.title = `AireMañana — ${L.h1}`;
  document.getElementById("back").href = `./?${sc ? `sc=${sc}` : `st=${st}`}&lang=${lang}`;
  document.getElementById("print").addEventListener("click", () => window.print());

  Promise.all([fetch("data/forecast.json").then(r => r.json()), fetch("data/profiles.json").then(r => r.json()),
    fetch("data/evaluation.json").then(r => r.json()), sc ? fetch("data/schools.json").then(r => r.json()) : null])
    .then(([F, P, E, S]) => {
      const s = F.stations.find(x => x.id === st) || F.stations[0], a = F.alert_at;
      const school = S ? S.schools.find(r => r[0] === sc) : null;
      const sid = school ? school[5] : s.id, sname = (F.stations.find(x => x.id === sid) || s).name;
      set("for", `${esc(t("for", { p: school ? school[1] : s.name }))}<br><span>${esc(school ? t("station", { s: sname, d: fmt(school[6], 1) }) : t("stationOnly", { s: sname }))}</span>`);
      set("rows", [["good", "ok", "okv"], ["mod", "watch", "watchv"], ["bad", "alert", "alertv"]].map(([c, k, v]) =>
        `<div class="row"><i style="background:var(--${c})"></i><div><b>${esc(L[k])}</b><span>${esc(t(v, { a: fmt(a) }))}</span></div></div>`).join(""));
      const m = new Date().getMonth(), shape = (P.shape[String(sid)] || {})[`0${m >= 3 && m <= 8 ? 1 : 0}`];
      if (shape) {
        const w = P.windows.reduce((b, x) => (shape[x] + shape[x + 1] < shape[b] + shape[b + 1] ? x : b), P.windows[0]);
        set("best", t("best", { w: `${w}:00–${w + 2}:00` }));
      } else document.getElementById("best").remove();
      const gain = 100 * (1 - E.results.v2.mean_abs_error / E.results.persistence.mean_abs_error);
      set("facts", [[`−${fmt(gain)}%`, L.f1], ["24", L.f2], [fmt(S ? S.schools.length : 1253), L.f3]]
        .map(([b, x]) => `<div><b>${b}</b><span>${esc(x)}</span></div>`).join(""));
    }).catch(err => console.error(err));

  // on narrow screens, scale the A4 sheet down to the width of the window
  const fit = () => {
    const el = document.getElementById("sheet"), k = Math.min(1, (innerWidth - 24) / el.offsetWidth);
    el.style.transform = k < 1 ? `scale(${k})` : "";
    el.parentElement.style.height = k < 1 ? `${el.offsetHeight * k + 40}px` : "";
  };
  addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
