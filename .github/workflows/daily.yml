# Every evening: forecast tomorrow for all 24 stations, save it, and publish the website.
name: Evening forecast

on:
  schedule:
    - cron: "35 17 * * *"   # 18:35 in Madrid in winter (19:35 in summer)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  forecast:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python make_site_data.py live
      - name: Save the forecast in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/forecast.json web/data/log.csv
          git diff --cached --quiet || git commit -m "Forecast for tomorrow ($(date -u +%F))"
          git push

  deploy:
    needs: forecast
    if: always() && needs.forecast.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
